<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Record feedback delivery</title><link rel="stylesheet" href="/v2/style.css"><script src="/v2/feedback-delivery.js" defer></script></head>
<body><main><h1>Record feedback delivery</h1><p>This records your confirmed delivery for the exact report versions now present. Saved PDFs remain available to reprint. New or revised reports remain pending.</p>

<button id="prepare" type="button">Review exact reports</button><p id="status" role="status"></p><div id="review"></div>
<label><input id="attest" type="checkbox" disabled> I confirm the reports in this exact review were printed.</label>
<button id="confirm" type="button" disabled>Record confirmed delivery</button><p><a href="/v2/">Return to the Hub</a></p></main></body></html>
