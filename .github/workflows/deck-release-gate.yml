name: Deterministic release gate

on:
  pull_request:
    paths:
      - 'src/school_workflow_hub/adapters/agenda_prompts.py'
      - 'tests/test_agenda_prompts.py'
      - 'src/school_workflow_hub/workflows/assessment_records.py'
      - 'tests/test_assessment_records.py'
      - 'src/school_workflow_hub/workflows/deck_release.py'
      - 'tests/test_deck_release.py'
      - 'src/hub_v2/audit.py'
      - 'src/hub_v2/static/app.js'
      - 'src/hub_v2/static/index.html'
      - 'src/hub_v2/static/style.css'
      - 'tests/test_hub_v2.py'
      - 'src/school_workflow_hub/adapters/assessment_provider.py'
      - 'tests/test_assessment_provider.py'
      - 'src/school_workflow_hub/adapters/dated_agenda.py'
      - 'src/school_workflow_hub/adapters/shared_form_intake.py'
      - 'tests/test_dated_agenda.py'
      - 'tests/test_shared_intake_catalog.py'
      - 'src/school_workflow_hub/adapters/dated_agenda.py'
      - 'src/school_workflow_hub/adapters/shared_form_intake.py'
      - 'tests/test_dated_agenda.py'
      - 'tests/test_shared_intake_catalog.py'
      - '.github/workflows/deck-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/school_workflow_hub/adapters/agenda_prompts.py'
      - 'tests/test_agenda_prompts.py'
      - 'src/school_workflow_hub/workflows/assessment_records.py'
      - 'tests/test_assessment_records.py'
      - 'src/school_workflow_hub/workflows/deck_release.py'
      - 'tests/test_deck_release.py'
      - 'src/hub_v2/audit.py'
      - 'src/hub_v2/static/app.js'
      - 'src/hub_v2/static/index.html'
      - 'src/hub_v2/static/style.css'
      - 'tests/test_hub_v2.py'
      - 'src/school_workflow_hub/adapters/assessment_provider.py'
      - 'tests/test_assessment_provider.py'
      - '.github/workflows/deck-release-gate.yml'

permissions:
  contents: read

concurrency:
  group: deck-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Run deterministic release and provider tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src
        run: python3 -m unittest tests.test_deck_release tests.test_assessment_provider tests.test_assessment_records tests.test_agenda_prompts tests.test_hub_v2 tests.test_dated_agenda tests.test_shared_intake_catalog
      - name: Check Hub browser JavaScript syntax
        run: node --check src/hub_v2/static/app.js
