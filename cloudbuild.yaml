# Cloud Build: test, build the image, and point the Cloud Run Job at it.
# Triggered on pushes to main (see deploy/README.md for the one-time trigger setup).
substitutions:
  _REGION: us-east1
  _REPO: preflight
  _JOB: weekly-preflight

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements-dev.txt && python -m pytest -q"]

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/preflight:$SHORT_SHA",
           "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/preflight:latest", "."]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/preflight"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "jobs", "update", "${_JOB}", "--region", "${_REGION}",
           "--image", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/preflight:$SHORT_SHA"]

options:
  logging: CLOUD_LOGGING_ONLY
